<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Forge Platform Demo | Offline</title>
    <link rel="icon" href="https://forgeplatform.software/favicon.ico" sizes="any" />
    <link
      rel="preload"
      href="https://forgeplatform.software/assets/fonts/Helvetica/HelveticaNowText-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous" />
    <link
      rel="preload"
      href="https://forgeplatform.software/assets/fonts/Helvetica/HelveticaNowText-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous" />
    <link
      rel="preload"
      href="https://forgeplatform.software/assets/fonts/Helvetica/HelveticaNowText-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous" />
    <link
      rel="preload"
      href="https://forgeplatform.software/assets/fonts/Helvetica/HelveticaNowDisplay-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous" />
    <link
      rel="preload"
      href="https://forgeplatform.software/assets/fonts/Helvetica/HelveticaNowDisplay-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="https://forgeplatform.software/assets/css/main.css" media="all" />
    <style>
      @font-face {
        font-family: "Helvetica Now Text";
        src:
          local("Helvetica Now Text  Regular"),
          local("HelveticaNowText-Regular"),
          url("https://forgeplatform.software/assets/fonts/Helvetica/HelveticaNowText-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Helvetica Now Text";
        src:
          local("Helvetica Now Text  Medium"),
          local("HelveticaNowText-Medium"),
          url("https://forgeplatform.software/assets/fonts/Helvetica/HelveticaNowText-Medium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Helvetica Now Text";
        src:
          local("Helvetica Now Text  Bold"),
          local("HelveticaNowText-Bold"),
          url("https://forgeplatform.software/assets/fonts/Helvetica/HelveticaNowText-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Helvetica Now Display";
        src:
          local("Helvetica Now Display Medium"),
          local("HelveticaNowDisplay-Medium"),
          url("https://forgeplatform.software/assets/fonts/Helvetica/HelveticaNowDisplay-Medium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Helvetica Now Display";
        src:
          local("Helvetica Now Display Bold"),
          local("HelveticaNowDisplay-Bold"),
          url("https://forgeplatform.software/assets/fonts/Helvetica/HelveticaNowDisplay-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body class="helvetica bg-[#0B0C14] text-neutral-200">
    <div class="main overflow-x-hidden has-top-glow">
      <header
        class="z-40 top-0 left-0 right-0 flex justify-center helvetica bg-[#0B0C14]/80 fixed before:absolute before:-z-10 before:inset-0 before:backdrop-blur-2xl"
        id="navbar">
        <nav
          class="grow flex h-[52px] border-b mx-5 max-w-[1110px] text-[13px] leading-[100%] text-[#C9D3EE] border-[#727DA1]/15">
          <div class="flex min-w-0 items-stretch gap-3">
            <a aria-label="Go to homepage" class="flex shrink-0 items-center py-3" href="https://forgeplatform.software/">
              <svg width="154" height="21" class="forge-site-header-logo svg-currentcolor" aria-hidden="true" focusable="false">
                <use href="https://forgeplatform.software/assets/images/brand/forge-logo.svg#root"></use>
              </svg>
            </a>
          </div>
        </nav>
      </header>

      <main class="mx-auto max-w-[1110px] px-5 pt-32 pb-24">
        <div class="max-w-[820px]" style="text-wrap: pretty">
          <h1 class="font-helveticaDisplay text-white font-bold text-[40px] leading-[110%]">Demo environment offline</h1>
          <p class="mt-4 text-neutral-300 text-lg leading-[145%]">
            The Forge Platform demo site is not currently running. Contact
            <a class="text-[#C9D3EE] hover:text-white transition" href="mailto:intro@forgeplatform.software"
              >intro@forgeplatform.software</a
            >
            to arrange a live demo.
          </p>
          <p class="mt-6">
            <a class="text-[#C9D3EE] hover:text-white transition" href="https://forgeplatform.software/"
              >&larr; Back to forgeplatform.software</a
            >
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
